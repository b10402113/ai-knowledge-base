name: Daily Knowledge Collection

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python pipeline/pipeline.py --sources github,rss --limit 20 --verbose

      - name: Validate JSON
        run: |
          shopt -s nullglob
          files=(knowledge/articles/2*.json)
          if [ ${#files[@]} -gt 0 ]; then
            python hooks/validate_json.py "${files[@]}"
          fi

      - name: Check quality
        run: python hooks/check_quality.py

      - name: Count new articles
        id: count
        run: |
          ARTICLES_DIR="knowledge/articles"
          if [ -d "$ARTICLES_DIR" ]; then
            COUNT=$(git diff --name-only --diff-filter=A "$ARTICLES_DIR" | wc -l | tr -d ' ')
          else
            COUNT=0
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "New articles: $COUNT"

      - name: Commit and push
        if: steps.count.outputs.count > 0
        run: |
          DATE=$(date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge/
          git commit -m "📰 ${DATE}: +${{ steps.count.outputs.count }} articles"
          git push
