<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Knowledge Base</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117; --surface: #161b22; --border: #30363d;
  --text: #e6edf3; --text2: #8b949e; --accent: #58a6ff;
  --green: #3fb950; --orange: #d29922; --red: #f85149;
  --radius: 8px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

header { border-bottom: 1px solid var(--border); padding: 16px 24px; position: sticky; top: 0; background: var(--bg); z-index: 100; }
.header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
header h1 { font-size: 20px; font-weight: 600; }
header h1 span { color: var(--accent); }

.filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.filters label { font-size: 13px; color: var(--text2); }
.filters input, .filters select {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  padding: 6px 12px; border-radius: var(--radius); font-size: 13px; outline: none;
}
.filters input:focus, .filters select:focus { border-color: var(--accent); }
.filters input[type="text"] { width: 200px; }

main { max-width: 1200px; margin: 0 auto; padding: 24px; }

.stats { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 20px; }
.stat-card .num { font-size: 28px; font-weight: 700; color: var(--accent); }
.stat-card .label { font-size: 12px; color: var(--text2); }

.date-group { margin-bottom: 32px; }
.date-header {
  font-size: 15px; font-weight: 600; color: var(--text2);
  padding: 8px 0; border-bottom: 1px solid var(--border); margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.date-header .count { background: var(--border); padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 400; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; display: flex; flex-direction: column; gap: 10px;
  transition: border-color 0.15s;
}
.card:hover { border-color: var(--accent); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card-title { font-size: 15px; font-weight: 600; word-break: break-all; }
.card-title a { color: var(--text); }
.card-title a:hover { color: var(--accent); }
.source-badge {
  font-size: 11px; padding: 2px 8px; border-radius: 12px; white-space: nowrap;
  background: #1f2937; color: var(--accent); border: 1px solid var(--border);
}

.score-ring {
  width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; flex-shrink: 0;
  border: 3px solid var(--green);
  color: var(--green);
}
.score-ring.mid { border-color: var(--orange); color: var(--orange); }
.score-ring.low { border-color: var(--red); color: var(--red); }

.card-summary { font-size: 13px; color: var(--text2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card-summary.expanded { -webkit-line-clamp: unset; }

.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 12px; background: var(--bg); color: var(--text2); border: 1px solid var(--border); }
.tag.match { border-color: var(--accent); color: var(--accent); }

.empty { text-align: center; padding: 60px 20px; color: var(--text2); }
.empty .icon { font-size: 48px; margin-bottom: 12px; }

@media (max-width: 600px) {
  .cards { grid-template-columns: 1fr; }
  .filters input[type="text"] { width: 100%; }
  .header-inner { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1><span>AI</span> Knowledge Base</h1>
    <div class="filters">
      <label>日期</label>
      <select id="dateFilter"><option value="">全部</option></select>
      <label>搜尋</label>
      <input type="text" id="searchInput" placeholder="標題、標籤、摘要...">
      <label>排序</label>
      <select id="sortSelect">
        <option value="date-desc">日期 ↓</option>
        <option value="date-asc">日期 ↑</option>
        <option value="score-desc">相關度 ↓</option>
        <option value="score-asc">相關度 ↑</option>
      </select>
    </div>
  </div>
</header>

<main>
  <div class="stats" id="stats"></div>
  <div id="content"></div>
</main>

<script>
const ARTICLES_PATH = '/knowledge/articles/';
let allArticles = [];

async function loadIndex() {
  try {
    const res = await fetch(ARTICLES_PATH + 'index.json');
    const index = await res.json();
    const articles = await Promise.all(
      index.entries.map(async (entry) => {
        try {
          const r = await fetch(ARTICLES_PATH + entry.file);
          return await r.json();
        } catch { return null; }
      })
    );
    return articles.filter(Boolean);
  } catch {
    return [];
  }
}

function getDate(iso) { return iso ? iso.slice(0, 10) : 'unknown'; }
function getScoreColor(score) {
  if (score >= 0.85) return '';
  if (score >= 0.7) return 'mid';
  return 'low';
}

function renderStats(articles) {
  const dates = new Set(articles.map(a => getDate(a.collected_at)));
  const tags = new Set(articles.flatMap(a => a.tags || []));
  const avg = articles.length ? (articles.reduce((s, a) => s + (a.relevance_score || 0), 0) / articles.length).toFixed(2) : 0;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="num">${articles.length}</div><div class="label">文章總數</div></div>
    <div class="stat-card"><div class="num">${dates.size}</div><div class="label">採集天數</div></div>
    <div class="stat-card"><div class="num">${tags.size}</div><div class="label">標籤數</div></div>
    <div class="stat-card"><div class="num">${avg}</div><div class="label">平均相關度</div></div>
  `;
}

function renderDateFilter(articles) {
  const dates = [...new Set(articles.map(a => getDate(a.collected_at)))].sort().reverse();
  const sel = document.getElementById('dateFilter');
  sel.innerHTML = '<option value="">全部日期</option>' + dates.map(d => `<option value="${d}">${d}</option>`).join('');
}

function render(articles, query) {
  const container = document.getElementById('content');
  if (!articles.length) {
    container.innerHTML = '<div class="empty"><div class="icon">📭</div><div>沒有符合條件的條目</div></div>';
    return;
  }

  const grouped = {};
  articles.forEach(a => {
    const d = getDate(a.collected_at);
    (grouped[d] = grouped[d] || []).push(a);
  });

  const queryLower = (query || '').toLowerCase();

  container.innerHTML = Object.entries(grouped).sort(([a], [b]) => b.localeCompare(a)).map(([date, items]) => `
    <div class="date-group">
      <div class="date-header">📅 ${date} <span class="count">${items.length} 則</span></div>
      <div class="cards">
        ${items.map(a => renderCard(a, queryLower)).join('')}
      </div>
    </div>
  `).join('');
}

function renderCard(a, queryLower) {
  const score = (a.relevance_score || 0).toFixed(2);
  const scoreClass = getScoreColor(a.relevance_score);
  const matchedTags = queryLower ? (a.tags || []).filter(t => t.includes(queryLower)) : [];

  return `
    <div class="card">
      <div class="card-top">
        <div>
          <div class="card-title">
            <a href="${a.url || '#'}" target="_blank" rel="noopener">${escapeHtml(a.source_id || a.title)}</a>
          </div>
          <span class="source-badge">${a.source || ''}</span>
        </div>
        <div class="score-ring ${scoreClass}">${score}</div>
      </div>
      <div class="card-summary" onclick="this.classList.toggle('expanded')">${escapeHtml(a.summary || '')}</div>
      <div class="tags">
        ${(a.tags || []).map(t => `<span class="tag${matchedTags.includes(t) ? ' match' : ''}">${t}</span>`).join('')}
      </div>
    </div>
  `;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function getFiltered() {
  const dateVal = document.getElementById('dateFilter').value;
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const sort = document.getElementById('sortSelect').value;

  let list = allArticles;
  if (dateVal) list = list.filter(a => getDate(a.collected_at) === dateVal);
  if (query) {
    list = list.filter(a =>
      (a.title || '').toLowerCase().includes(query) ||
      (a.source_id || '').toLowerCase().includes(query) ||
      (a.summary || '').toLowerCase().includes(query) ||
      (a.tags || []).some(t => t.toLowerCase().includes(query))
    );
  }

  list.sort((a, b) => {
    switch (sort) {
      case 'date-desc': return (b.collected_at || '').localeCompare(a.collected_at || '');
      case 'date-asc': return (a.collected_at || '').localeCompare(b.collected_at || '');
      case 'score-desc': return (b.relevance_score || 0) - (a.relevance_score || 0);
      case 'score-asc': return (a.relevance_score || 0) - (b.relevance_score || 0);
    }
    return 0;
  });

  render(list, query);
}

async function init() {
  allArticles = await loadIndex();
  if (!allArticles.length) {
    document.getElementById('content').innerHTML = '<div class="empty"><div class="icon">⚠️</div><div>無法載入資料。請透過 HTTP 伺服器開啟此頁面。<br><code>cd site && python3 -m http.server 8080</code></div></div>';
    return;
  }
  renderStats(allArticles);
  renderDateFilter(allArticles);
  getFiltered();
}

document.getElementById('dateFilter').addEventListener('change', getFiltered);
document.getElementById('searchInput').addEventListener('input', getFiltered);
document.getElementById('sortSelect').addEventListener('change', getFiltered);

init();
</script>
</body>
</html>
