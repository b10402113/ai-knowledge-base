# RSS 数据源配置
# 知识库采集流水线使用此文件决定从哪些源抓取内容
# enabled: false 的源会被跳过

sources:
  # ── 综合技术 ──────────────────────────────────────
  - name: Hacker News Best (AI)
    url: https://hnrss.org/best?q=AI+LLM+agent&count=30
    category: general-tech
    enabled: true

  - name: Lobsters AI/ML
    url: https://lobste.rs/t/ai,ml.rss
    category: general-tech
    enabled: true

  # ── AI 研究 ───────────────────────────────────────
  - name: arXiv cs.AI
    url: https://rss.arxiv.org/rss/cs.AI
    category: ai-research
    enabled: false  # 日更量大（数百篇），按需开启

  # ── 公司博客 ───────────────────────────────────────
  - name: OpenAI Blog
    url: https://openai.com/blog/rss.xml
    category: company-blog
    enabled: true

  - name: Anthropic Research
    url: https://www.anthropic.com/feed.xml
    category: company-blog
    enabled: true

  - name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    category: company-blog
    enabled: true

  # ── 中文社区 ───────────────────────────────────────
  # 注意：以下源的 RSS 可用性需要验证后再启用
  - name: 机器之心
    url: https://www.jiqizhixin.com/rss
    category: chinese-community
    enabled: false

  - name: 量子位
    url: https://www.qbitai.com/rss
    category: chinese-community
    enabled: false
